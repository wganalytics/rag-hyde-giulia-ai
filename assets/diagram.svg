<svg xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 680 860"
  width="2040" height="2580"
  role="img"
  style="font-family: 'Inter', 'Segoe UI', sans-serif; background: #0f1117;">

  <title>PRJ-08 Documento Hipotético (HyDE RAG) — GIULIA AI Engineering Ecosystem</title>
  <desc>Pipeline de HyDE RAG com Geração de Documentos Hipotéticos: Query → Geração de Documento Falso (LLM) → Vector Store (ChromaDB) → Recuperação Semelhante Real → Resposta Final</desc>

  <defs>
    <!-- Arrow marker -->
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="var(--arr-color, #4a5568)"/>
    </marker>

    <!-- Glow filter for central database and engine -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    :root {
      --bg: #0f1117;
      --surface: #161b27;
      --border-primary: rgba(255,255,255,0.15);
      --border-secondary: rgba(255,255,255,0.08);
      --border-tertiary: rgba(255,255,255,0.05);
      --text-primary: #e8eaf0;
      --text-secondary: #8892a4;
    }

    .th {
      fill: #e8eaf0;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .ts {
      fill: #8892a4;
      font-size: 10px;
      font-weight: 400;
    }
    .arr {
      stroke-width: 1.2;
      fill: none;
    }

    /* Node colors following standard convention */
    .c-gray  rect { fill: #1e2330; stroke: rgba(148,163,184,0.4); }
    .c-teal  rect { fill: #0d2d2d; stroke: rgba( 45,212,191,0.45); }
    .c-purple rect { fill: #1e1530; stroke: rgba(139,92, 246,0.5); }
    .c-blue  rect { fill: #0d1e3d; stroke: rgba( 59,130,246,0.6); }
    .c-amber rect { fill: #2d1f00; stroke: rgba(245,158, 11,0.5); }
    .c-coral rect { fill: #2d1010; stroke: rgba(239, 68, 68,0.5); }
    .c-green rect { fill: #0d2d1a; stroke: rgba( 34,197, 94,0.5); }

    .c-gray  .th { fill: #94a3b8; }
    .c-teal  .th { fill: #2dd4bf; }
    .c-purple .th { fill: #a78bfa; }
    .c-blue  .th { fill: #60a5fa; }
    .c-amber .th { fill: #fbbf24; }
    .c-coral .th { fill: #f87171; }
    .c-green .th { fill: #4ade80; }

    /* Hover effect */
    .node { cursor: pointer; transition: opacity 0.2s; }
    .node:hover { opacity: 0.82; }
    .node:hover rect { stroke-width: 1.5 !important; }

    /* Arrow colors per flow */
    .arr-gray   { stroke: rgba(148,163,184,0.4); }
    .arr-teal   { stroke: rgba( 45,212,191,0.4); }
    .arr-purple { stroke: rgba(139, 92,246,0.4); }
    .arr-blue   { stroke: rgba( 59,130,246,0.5); }
    .arr-green  { stroke: rgba( 34,197, 94,0.4); }
    .arr-amber  { stroke: rgba(245, 158, 11, 0.4); }
    .arr-coral  { stroke: rgba(239, 68, 68, 0.4); }

    /* Phase labels */
    .phase-label {
      fill: rgba(255,255,255,0.3);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
  </style>

  <!-- BACKGROUND PANEL -->
  <rect width="680" height="860" fill="#0f1117"/>

  <!-- Header -->
  <rect x="0" y="0" width="680" height="56" fill="#0d1117"/>
  <text x="340" y="24" text-anchor="middle" dominant-baseline="central"
    font-size="13" font-weight="700" fill="#e8eaf0">
    PRJ-08 · HyDE RAG (Documento Hipotético)
  </text>
  <text x="340" y="44" text-anchor="middle" dominant-baseline="central"
    font-size="10" fill="#fbbf24" letter-spacing="2">
    HYPOTHETICAL DOCUMENT EMBEDDINGS · NOMIC EMBEDDINGS · OLLAMA LOCAL
  </text>

  <!-- ══════════════════════════════════════════════════
       FASE 1: HYPOTHETICAL DOCUMENT GENERATION
  ══════════════════════════════════════════════════ -->
  <text class="phase-label" x="40" y="88">FASE 1: GERAÇÃO DO DOCUMENTO HIPOTÉTICO (HYDE)</text>
  <line x1="40" y1="96" x2="640" y2="96" stroke="rgba(255,255,255,0.05)" stroke-width="0.5" stroke-dasharray="4 4"/>

  <!-- Node: User Query -->
  <g class="node c-amber" onclick="sendPrompt('Como a consulta do usuário inicia o fluxo HyDE?')">
    <rect x="40" y="115" width="160" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="120" y="135" text-anchor="middle" dominant-baseline="central">🙋 Consulta do Usuário</text>
    <text class="ts" x="120" y="154" text-anchor="middle" dominant-baseline="central">NL: "Como configurar X?"</text>
  </g>

  <!-- Arrow: Query -> Hypo Generator -->
  <line x1="200" y1="141" x2="238" y2="141" class="arr arr-gray" marker-end="url(#arrow)"/>

  <!-- Node: LLM Hypothetical Generator -->
  <g class="node c-coral" onclick="sendPrompt('Como o LLM local é instruído a gerar um documento ideal contendo a resposta hipotética?')">
    <rect x="240" y="115" width="200" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="135" text-anchor="middle" dominant-baseline="central">🤖 LLM: Geração Hipotética</text>
    <text class="ts" x="340" y="154" text-anchor="middle" dominant-baseline="central">Ollama: llama3.2 (Prompt HyDE)</text>
  </g>

  <!-- Arrow: Generator -> Hypo Document -->
  <line x1="440" y1="141" x2="478" y2="141" class="arr arr-coral" marker-end="url(#arrow)"/>

  <!-- Node: Hypothetical Document -->
  <g class="node c-amber" onclick="sendPrompt('O que é o Documento Hipotético e como ele melhora a busca vetorial?')">
    <rect x="480" y="115" width="160" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="560" y="135" text-anchor="middle" dominant-baseline="central">📄 Documento Hipotético</text>
    <text class="ts" x="560" y="154" text-anchor="middle" dominant-baseline="central">Contexto falso com resposta ideal</text>
  </g>

  <!-- ══════════════════════════════════════════════════
       FASE 2: VECTOR EMBEDDING & RETRIEVAL
  ══════════════════════════════════════════════════ -->
  <text class="phase-label" x="40" y="225">FASE 2: VETORIZAÇÃO E BUSCA DE ALTA ADERÊNCIA</text>
  <line x1="40" y1="233" x2="640" y2="233" stroke="rgba(255,255,255,0.05)" stroke-width="0.5" stroke-dasharray="4 4"/>

  <!-- Arrow from Hypo Document to Embedder -->
  <path d="M 560 167 L 560 250 L 440 250" class="arr arr-amber" marker-end="url(#arrow)"/>

  <!-- Node: Embedding Model -->
  <g class="node c-teal" onclick="sendPrompt('Qual o papel do modelo Nomic Embeddings na vetorização do documento hipotético?')">
    <rect x="240" y="225" width="200" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="245" text-anchor="middle" dominant-baseline="central">📐 Nomic Embeddings</text>
    <text class="ts" x="340" y="264" text-anchor="middle" dominant-baseline="central">Vetoriza o Documento Ideal</text>
  </g>

  <!-- Arrow from Embedder to Vector Store -->
  <line x1="340" y1="277" x2="340" y2="330" class="arr arr-teal" marker-end="url(#arrow)"/>

  <!-- Node: Vector Store (ChromaDB) -->
  <g class="node c-blue" filter="url(#glow)" onclick="sendPrompt('Como o ChromaDB busca documentos reais usando o vetor do documento hipotético?')">
    <rect x="230" y="330" width="220" height="62" rx="10" stroke-width="1.5"/>
    <text class="th" x="340" y="352" text-anchor="middle" dominant-baseline="central">📦 Vector Store: ChromaDB</text>
    <text class="ts" x="340" y="373" text-anchor="middle" dominant-baseline="central">Busca por Similaridade de Cosseno</text>
    <text class="ts" x="340" y="383" text-anchor="middle" dominant-baseline="central">Busca de Documento Real vs Documento Ideal</text>
  </g>

  <!-- ══════════════════════════════════════════════════
       FASE 3: REAL CONTEXT RETRIEVAL & SYNTHESIS
  ══════════════════════════════════════════════════ -->
  <text class="phase-label" x="40" y="455">FASE 3: RECUPERAÇÃO DE CONTEXTO REAL E SÍNTESE</text>
  <line x1="40" y1="463" x2="640" y2="463" stroke="rgba(255,255,255,0.05)" stroke-width="0.5" stroke-dasharray="4 4"/>

  <!-- Arrow from ChromaDB to Real Context -->
  <line x1="340" y1="392" x2="340" y2="490" class="arr arr-blue" marker-end="url(#arrow)"/>

  <!-- Node: Real Documents Context -->
  <g class="node c-green" onclick="sendPrompt('Como os documentos reais recuperados eliminam quaisquer alucinações geradas no documento hipotético?')">
    <rect x="240" y="490" width="200" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="510" text-anchor="middle" dominant-baseline="central">📄 Contexto Real Recuperado</text>
    <text class="ts" x="340" y="529" text-anchor="middle" dominant-baseline="central">Substitui as suposições hipotéticas</text>
  </g>

  <!-- Arrow from Real Context to LLM Synthesizer -->
  <line x1="340" y1="542" x2="340" y2="600" class="arr arr-green" marker-end="url(#arrow)"/>

  <!-- Node: LLM Final Synthesizer -->
  <g class="node c-coral" onclick="sendPrompt('Como a resposta final é gerada pelo llama3.2 combinando a pergunta original e os dados reais?')">
    <rect x="240" y="600" width="200" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="620" text-anchor="middle" dominant-baseline="central">🤖 LLM Final Synthesizer</text>
    <text class="ts" x="340" y="639" text-anchor="middle" dominant-baseline="central">llama3.2:3b Local (Ollama)</text>
  </g>

  <!-- Arrow from LLM to Output -->
  <line x1="340" y1="652" x2="340" y2="710" class="arr arr-coral" marker-end="url(#arrow)"/>

  <!-- Node: Output Response -->
  <g class="node c-green" onclick="sendPrompt('Qual o resultado final exibido no Streamlit para o usuário?')">
    <rect x="180" y="710" width="320" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="730" text-anchor="middle" dominant-baseline="central">✅ Resposta de Alta Precisão HyDE</text>
    <text class="ts" x="340" y="749" text-anchor="middle" dominant-baseline="central">Fidelidade total baseada exclusivamente em dados reais</text>
  </g>

  <!-- ══════════════════════════════════════════════════
       FOOTER — METRICS
  ══════════════════════════════════════════════════ -->
  <rect x="40" y="790" width="600" height="24" rx="4"
    fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
  <text class="ts" x="340" y="802" text-anchor="middle" dominant-baseline="central" opacity="0.7">
    Métricas Reais: 7 arquivos Python · 223 linhas · 1 teste pytest OK (8.78s) · Epic GARE-89 Done
  </text>

  <script type="text/javascript">
    function sendPrompt(msg) {
      if (window.parent &amp;&amp; window.parent.postMessage) {
        window.parent.postMessage({ type: 'sendPrompt', content: msg }, '*');
      }
      console.log('[GIULIA Diagram] Prompt:', msg);
    }
  </script>
</svg>
